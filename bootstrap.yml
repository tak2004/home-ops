---
- name: Bootstrap the backbone server
  hosts: bootstrap
  become: yes

  tasks:
  - name: Install required packages
    ansible.builtin.apt:
      package:
       - netplan.io
       - systemd-resolved
       - systemd-timesyncd
       - neovim
       - s-tui
       - sudo
       - gpg
       - curl
    notify: networkd restarted

  # Nur die ARM-SBCs booten ueber armbianEnv.txt; auf x86 existiert die Datei nicht.
  - name: Check for Armbian boot configuration
    ansible.builtin.stat:
      path: /boot/armbianEnv.txt
    register: armbian_env

  - name: Disable UAS for the USB-SATA bridges
    ansible.builtin.lineinfile:
      path: /boot/armbianEnv.txt
      regexp: '^usbstoragequirks='
      line: 'usbstoragequirks={{ usb_storage_quirks }}'
    when: armbian_env.stat.exists

  - name: Repair the root filesystem automatically on boot
    ansible.builtin.lineinfile:
      path: /boot/armbianEnv.txt
      regexp: '^extraargs='
      line: 'extraargs={{ armbian_extraargs }}'
    when: armbian_env.stat.exists

  # Ohne laufende Zeitsynchronisation driftet die Uhr auf Hardware ohne verlaessliche
  # RTC weg. Zertifikate bekommen dann ein notBefore in der Zukunft und werden von den
  # anderen Nodes abgelehnt ("tls alert certificate expired") -- ein kubeadm join
  # scheitert daran, ohne dass die Ursache irgendwo Zeit erwaehnt.
  - name: Enable time synchronisation
    ansible.builtin.systemd_service:
      name: systemd-timesyncd
      enabled: true
      state: started

  # Armbian legt 10-dhcp-all-interfaces.yaml an. Die hoehere Nummer gewinnt gegen
  # 01-netcfg.yaml, d.h. ohne diesen Schritt ueberschreibt DHCP die statische Adresse
  # -- lautlos, die statische Konfiguration steht dann wirkungslos in der Datei.
  - name: Disable Armbian DHCP netplan config
    ansible.builtin.command:
      cmd: mv /etc/netplan/10-dhcp-all-interfaces.yaml /root/10-dhcp-all-interfaces.yaml.disabled
      removes: /etc/netplan/10-dhcp-all-interfaces.yaml
    notify: Generate Netplan

  - name: Update Netplan Configuration
    template:
      src: templates/netplan.yml.j2
      dest: /etc/netplan/01-netcfg.yaml
      mode: '0600'
    notify: Generate Netplan

  - name: Set hostname
    ansible.builtin.hostname:
      name: "{{ inventory_hostname }}"
  - name: Resolve hostname to localhost
    ansible.builtin.lineinfile:
      path: /etc/hosts
      line: '127.0.0.1 {{ inventory_hostname }}'
      search_string: '{{ inventory_hostname }}'

  - name: Create wheel group
    ansible.builtin.group:
      name: wheel
      state: present
  - name: Allow 'wheel' group to have passwordless sudo
    lineinfile:
      dest: /etc/sudoers
      state: present
      regexp: '^%wheel'
      line: '%wheel ALL=(ALL) NOPASSWD: ALL'
      validate: 'visudo -cf %s'

  - name: Add ansible user
    ansible.builtin.user:
      name: ansible
      home: /home/ansible/
      shell: /bin/bash
      system: true
      password: "!"
      groups: wheel
      append: yes
  - name: Install ansible user ssh key
    authorized_key:
      user: ansible
      key: "{{ lookup('file', 'pubkey') }}"
      state: present

  - name: Install root user ssh key
    authorized_key:
      user: root
      key: "{{ lookup('file', 'pubkey') }}"
      state: present
  - name: Remove distribution user
    ansible.builtin.user:
      name: "{{ distribution_user }}"
      remove: yes
      state: absent
  - name: Disable ssh password login
    ansible.builtin.copy:
      dest: /etc/ssh/sshd_config.d/additional.conf
      content: "PasswordAuthentication no"
    notify: restart ssh

  handlers:
  - name: Apply Netplan Changes
    command: netplan apply
    async: 45
    poll: 0
  - name: Generate Netplan
    command: netplan generate
    async: 45
    poll: 0
    notify: Apply Netplan Changes
    
  - name: restart ssh
    service:
      name: sshd
      state: restarted
  - name: networkd restarted
    service:
      name: systemd-networkd
      state: restarted