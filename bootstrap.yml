---
- name: Bootstrap the backbone server
  hosts: bootstrap
  become: yes

  tasks:
  - name: Install required packages
    ansible.builtin.apt:
      package:
       - netplan.io
       - systemd-resolved
       - systemd-timesyncd
       - neovim
       - s-tui
       - sudo
       - gpg
       - curl
    notify: networkd restarted

  # Only the ARM SBCs boot via armbianEnv.txt; the file does not exist on x86.
  - name: Check for Armbian boot configuration
    ansible.builtin.stat:
      path: /boot/armbianEnv.txt
    register: armbian_env

  - name: Disable UAS for the USB-SATA bridges
    ansible.builtin.lineinfile:
      path: /boot/armbianEnv.txt
      regexp: '^usbstoragequirks='
      line: 'usbstoragequirks={{ usb_storage_quirks }}'
    when: armbian_env.stat.exists

  - name: Repair the root filesystem automatically on boot
    ansible.builtin.lineinfile:
      path: /boot/armbianEnv.txt
      regexp: '^extraargs='
      line: 'extraargs={{ armbian_extraargs }}'
    when: armbian_env.stat.exists

  # Without time synchronisation the clock drifts on hardware without a reliable RTC.
  # Freshly issued certificates then carry a notBefore in the future and are rejected
  # by the other nodes ("tls alert certificate expired") -- a kubeadm join fails on
  # this without any message ever mentioning time.
  - name: Enable time synchronisation
    ansible.builtin.systemd_service:
      name: systemd-timesyncd
      enabled: true
      state: started

  # Armbian ships 10-dhcp-all-interfaces.yaml. The higher number wins over
  # 01-netcfg.yaml, so without this step DHCP overrides the static address -- silently,
  # leaving the static configuration in the file with no effect at all.
  - name: Disable Armbian DHCP netplan config
    ansible.builtin.command:
      cmd: mv /etc/netplan/10-dhcp-all-interfaces.yaml /root/10-dhcp-all-interfaces.yaml.disabled
      removes: /etc/netplan/10-dhcp-all-interfaces.yaml
    notify: Generate Netplan

  # netplan renders through systemd-networkd. A NetworkManager running alongside it
  # starts its own dhclient and adds a second, *dynamic* address to the same NIC --
  # nothing in /etc/netplan shows it, and nothing reports an error. On backbone-1 that
  # was the router's old DHCP reservation for this MAC: the node gave itself the IP of
  # backbone-2, routed every packet for that peer to its own loopback, and etcd lost
  # quorum after each reboot.
  #
  # Needed here because bootstrap runs before k8s.yml ever touches the node, but the
  # same masking now also runs on every k8s_prepare_server pass -- once at provisioning
  # was not enough. On backbone-1 the sibling case (ifupdown) was found unmasked on
  # 2026-10-05 and cost the node 95 % of its inbound packets.
  - name: Disable NetworkManager in favour of systemd-networkd
    ansible.builtin.systemd:
      name: NetworkManager
      state: stopped
      enabled: false
      masked: true
    register: nm_masked_bootstrap
    # Not installed is fine; a real masking failure must not pass unnoticed.
    failed_when:
      - nm_masked_bootstrap is failed
      - '"Could not find the requested service" not in (nm_masked_bootstrap.msg | default(""))'

  - name: Update Netplan Configuration
    template:
      src: templates/netplan.yml.j2
      dest: /etc/netplan/01-netcfg.yaml
      mode: '0600'
    notify: Generate Netplan

  - name: Set hostname
    ansible.builtin.hostname:
      name: "{{ inventory_hostname }}"
  - name: Resolve hostname to localhost
    ansible.builtin.lineinfile:
      path: /etc/hosts
      line: '127.0.0.1 {{ inventory_hostname }}'
      search_string: '{{ inventory_hostname }}'

  - name: Create wheel group
    ansible.builtin.group:
      name: wheel
      state: present
  - name: Allow 'wheel' group to have passwordless sudo
    lineinfile:
      dest: /etc/sudoers
      state: present
      regexp: '^%wheel'
      line: '%wheel ALL=(ALL) NOPASSWD: ALL'
      validate: 'visudo -cf %s'

  - name: Add ansible user
    ansible.builtin.user:
      name: ansible
      home: /home/ansible/
      shell: /bin/bash
      system: true
      password: "!"
      groups: wheel
      append: yes
  - name: Install ansible user ssh key
    authorized_key:
      user: ansible
      key: "{{ lookup('file', 'pubkey') }}"
      state: present

  - name: Install root user ssh key
    authorized_key:
      user: root
      key: "{{ lookup('file', 'pubkey') }}"
      state: present
  - name: Remove distribution user
    ansible.builtin.user:
      name: "{{ distribution_user }}"
      remove: yes
      state: absent
  - name: Disable ssh password login
    ansible.builtin.copy:
      dest: /etc/ssh/sshd_config.d/additional.conf
      content: "PasswordAuthentication no"
    notify: restart ssh

  handlers:
  # Order matters and is not alphabetical: Ansible runs handlers in the order they are
  # DEFINED, not in notification order. With "Apply" defined first, the "Generate"
  # handler notified a handler that had already been passed over, so netplan apply
  # never ran in that flush -- the static address only took effect after a reboot, and
  # until then the node sat on whatever DHCP had given it. Same order as
  # roles/k8s_prepare_server/handlers/main.yml, which had it right all along.
  - name: Generate Netplan
    command: netplan generate
    async: 45
    poll: 0
    notify: Apply Netplan Changes
  - name: Apply Netplan Changes
    command: netplan apply
    async: 45
    poll: 0
    
  - name: restart ssh
    service:
      name: sshd
      state: restarted
  - name: networkd restarted
    service:
      name: systemd-networkd
      state: restarted