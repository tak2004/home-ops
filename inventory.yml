all:
  vars:
    ansible_ssh_private_key_file: ~/.ssh/homelab
    ansible_user: ansible
    gateway_ip: 192.168.1.1
    k8s_init_node: backbone-2
    k8s_hostname: k8scp
    # k8scp resolves to the keepalived VIP rather than a single node, otherwise the
    # whole cluster endpoint depends on the init node. Defined for all groups because
    # k8s_prepare_server also runs on netsvc.
    virtual_ip: 192.168.1.10
    virtual_mask: 24
    # The SBCs boot from SD card while root lives on a USB-SATA bridge. Both bridges
    # in use implement UAS incorrectly: under load commands abort
    # (uas_eh_abort_handler, cmd_age=30s), the ext4 journal aborts and errors=remount-ro
    # turns / read-only -- the node fails without the disk being faulty. These quirks
    # force a fallback to usb-storage (BOT).
    # A quirk for a bridge that is not present has no effect, so list them together.
    #   0x2537:...   Norelsys (Armbian default)
    #   0x7825:a2a4  OWC PA023U3     (backbone-2)
    #   0x152d:0578  JMicron JMS578  (backbone-3)
    usb_storage_quirks: "0x2537:0x1066:u,0x2537:0x1068:u,0x7825:0xa2a4:u,0x152d:0x0578:u"
    # fsck.repair=yes, because otherwise the SBCs stall during boot on a damaged
    # filesystem and the disk has to be repaired by hand on another machine.
    armbian_extraargs: "cma=256M fsck.repair=yes"
    # Cilium LoadBalancerIPPool -- must be a FREE range. This used to hold the node
    # addresses themselves, so Cilium would have handed out service IPs that already
    # belong to the nodes.
    lb_start_ip: 192.168.1.20
    lb_stop_ip: 192.168.1.29
    # bind9 runs on every backbone node and is authoritative for this zone. All of
    # them listen, but only the node holding the VIP answers -- that way the Fritzbox
    # needs just one nameserver address, and DNS survives a node failure.
    dns_zone: home
    dns_allow_query: "192.168.1.0/24"
    # Everything under this subdomain is delegated to the cluster ingress via a
    # wildcard record, so a new Ingress needs no DNS change at all -- only a host
    # rule like dashboard.svc.home. ingress_ip is the LoadBalancer address of
    # cilium-ingress and must stay inside the lb pool.
    k8s_subdomain: svc
    ingress_ip: 192.168.1.20
    # Extra A records for hosts reached directly instead of through the ingress.
    # Normally empty: services belong under the wildcard above, which needs no DNS
    # change per service. Any entry here also has to be pinned on the service with
    # lbipam.cilium.io/ips, or Cilium may hand out a different IP and the record
    # goes stale.
    dns_records: {}
backbone:
  hosts:
    # Note: backbone-1 is .12 and backbone-2 is .11 -- do not swap them.
    # backbone-2 is the original init node; its control plane and all certificates
    # are issued for 192.168.1.11.
    backbone-1:
      ansible_host: 192.168.1.12
      nic: enp1s0
      # Third vote for the two-replica DRBD resources, without storing data itself.
      # backbone-2 and -3 cannot do this: DRBD would have to be built for their
      # arm64 vendor kernel, and they have no kernel headers available.
      linstor_node: tiebreaker
      # The only control-plane node with enough memory to also take workloads.
      k8s_schedulable: true
    backbone-2:
      ansible_host: 192.168.1.11
      nic: end1
    backbone-3:
      ansible_host: 192.168.1.13
      nic: end1
netsvc:
  vars:
    nic: enp6s0f0
    # Second SFP+ port, cabled directly between the two nodes (no switch in
    # between). DRBD replicates over this link, so storage traffic never touches
    # the 1G home network. Jumbo frames: measured 9.90 Gbit/s at 0.24 ms.
    replication_nic: enp6s0f1
    replication_mask: 24
    replication_mtu: 9000
    # Carries a storage pool. See the linstor_storage role.
    linstor_node: disk
  hosts:
    netsvc-1:
      ansible_host: 192.168.1.14
      replication_ip: 10.10.10.1
    netsvc-2:
      ansible_host: 192.168.1.15
      replication_ip: 10.10.10.2
bootstrap:
  vars:
    ansible_user: root
    ansible_password: 1234
    distribution_user: deleteme
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  hosts:
    backbone-1:
      static_ip: 192.168.1.12
    backbone-2:
      static_ip: 192.168.1.11
    backbone-3:
      static_ip: 192.168.1.13
    netsvc-1:
      static_ip: 192.168.1.14
    netsvc-2:
      static_ip: 192.168.1.15
#    netsvc-3:
#      static_ip: 192.168.3.20
