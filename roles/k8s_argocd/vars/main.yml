---
argocd_domain: "argocd.svc.home"
app_repo: https://github.com/tak2004/home-ops-apps.git
# Pinned: without --version helm installs whatever is newest, which turns every
# playbook run into an unplanned Argo CD upgrade.
argocd_version: 8.3.0
argocd_apps_version: 2.0.2
# The OpenID Connect provider. Argo talks to it directly rather than through its
# bundled Dex: Dex is a broker for upstreams that are not OIDC, and Authelia is.
authelia_domain: "auth.svc.home"
# The group whose members get role:admin. It lives in LLDAP, and membership is
# evaluated at every login, so rights are withdrawn there rather than here.
argocd_admin_group: "admins"
