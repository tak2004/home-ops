---
- name: Install bind9
  ansible.builtin.apt:
    pkg: ['bind9', 'bind9utils', 'dnsutils', 'bind9-doc']
    # No cache update: a stale third-party repository on one node breaks the whole
    # run, and these packages come from the distribution anyway.
    update_cache: no
  notify: bind9-restart

# Must be written before named.conf.options, because named-checkconf -z validates
# the zone file referenced there.
- name: Write the internal zone
  template:
    src: db.zone.j2
    dest: /var/lib/bind/db.{{ dns_zone }}
    owner: root
    group: bind
    mode: '0644'
    validate: named-checkzone {{ dns_zone }} %s
  notify: bind9-restart

- name: Configure bind9
  template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    validate: named-checkconf -z %s
  notify: bind9-restart

- name: Enable bind9
  ansible.builtin.service:
    name: named
    enabled: true
    state: started
