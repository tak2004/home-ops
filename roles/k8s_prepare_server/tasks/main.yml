---
- name: Write noswap systemd service config file
  template:
    src: noswap.service.j2
    dest: /etc/systemd/system/noswap.service
    owner: root
    group: root
    mode: 0644
  notify: Enable noswap service

# overlay filesystem are necessary for containerd
- name: Enable Kernel modul overlay.
  community.general.modprobe:
    name: overlay
    state: present
# enables to bridge traffic
- name: Enable Kernel module br_netfilter.
  community.general.modprobe:
    name: br_netfilter
    state: present
- name: Allow necessary traffic.
  ansible.builtin.copy:
    dest: "/etc/sysctl.d/kubernetes.conf"
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
  register: sysctlconf
- name: Refresh sysctl.
  shell: sysctl --system
  when: sysctlconf.changed

# Helm used to come from baltocdn, whose certificate no longer verifies. One
# unreachable source makes apt-get update fail as a whole, so every later package
# task dies with "Failed to update apt cache" -- nothing points at the old repo.
- name: Remove repositories that were replaced
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/helm-stable-debian.list.old
    - /etc/apt/sources.list.d/cri-o.list
  tags: always

- name: Drop the stale baltocdn helm repository
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/helm-stable-debian.list
    regexp: 'baltocdn'
    state: absent
  failed_when: false
  tags: always

# containerd instead of cri-o: it is the runtime the distribution packages and
# the one Cilium and Piraeus are tested against. Mixing both on one node leaves
# two CRI sockets, and kubelet silently picks whichever it finds first.
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: yes
  tags: containerd

- name: Generate the containerd configuration
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml
  notify: Restart containerd
  tags: containerd

# kubelet runs with the systemd cgroup driver. With containerd left on cgroupfs the
# two disagree about who owns a container's cgroup, which shows up as pods that are
# evicted or restarted under memory pressure for no visible reason.
- name: Use the systemd cgroup driver
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*SystemdCgroup\s*=\s*)false$'
    replace: '\1true'
  notify: Restart containerd
  tags: containerd

# Debian ships bin_dir = /usr/lib/cni, while Cilium installs its plugin into
# /opt/cni/bin. Nothing complains until a *new* pod is scheduled -- running pods
# keep their networking, so the node looks Ready while every sandbox creation
# fails with 'failed to find plugin "cilium-cni"'.
- name: Point containerd at the CNI plugin directory Cilium installs into
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*bin_dir\s*=\s*)".*"$'
    replace: '\1"/opt/cni/bin"'
  notify: Restart containerd
  tags: containerd

- name: Add kubernetes repo key.
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
- name: Add kubernetes repositors.
  shell: |
    echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /' | tee /etc/apt/sources.list.d/kubernetes.list
  args:
    creates: /etc/apt/sources.list.d/kubernetes.list

- name: Install kubernetes tooling.
  ansible.builtin.apt:
    pkg:
    - kubeadm
    - kubelet
    - kubectl
    update_cache: yes

- name: Add helm repo key.
  shell: |
    curl -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey | gpg --dearmor | tee /usr/share/keyrings/helm.gpg > /dev/null
  args:
    creates: /usr/share/keyrings/helm.gpg
- name: Add helm repo.
  shell: |
    echo "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main" | tee /etc/apt/sources.list.d/helm-stable-debian.list
  args:
    creates: /etc/apt/sources.list.d/helm-stable-debian.list
- name: Install helm.
  ansible.builtin.apt:
    name: helm
    state: latest
    update_cache: yes
# k8scp used to point at the init node, tying the cluster endpoint to a single host:
# if it went down the API was gone for everyone, even though keepalived holds a VIP
# for exactly this case. Requires backbone.yml (keepalived) to have run first.
- name: Remove stale k8scp entries from /etc/hosts.
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^(?!{{ virtual_ip | regex_escape }}\s+{{ k8s_hostname }}\s*$).*\s{{ k8s_hostname }}\s*$'
    state: absent

- name: Point k8scp at the keepalived VIP.
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: '{{ virtual_ip }} {{ k8s_hostname }}'
    search_string: '{{ k8s_hostname }}'