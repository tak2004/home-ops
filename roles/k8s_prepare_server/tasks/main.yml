---
- name: Write noswap systemd service config file
  template:
    src: noswap.service.j2
    dest: /etc/systemd/system/noswap.service
    owner: root
    group: root
    mode: 0644
  notify: Enable noswap service

# overlay filesystem are necessary for containerd
- name: Enable Kernel modul overlay.
  community.general.modprobe:
    name: overlay
    state: present
# enables to bridge traffic
- name: Enable Kernel module br_netfilter.
  community.general.modprobe:
    name: br_netfilter
    state: present
- name: Allow necessary traffic.
  ansible.builtin.copy:
    dest: "/etc/sysctl.d/kubernetes.conf"
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
  register: sysctlconf
- name: Refresh sysctl.
  shell: sysctl --system
  when: sysctlconf.changed

# Helm used to come from baltocdn, whose certificate no longer verifies. One
# unreachable source makes apt-get update fail as a whole, so every later package
# task dies with "Failed to update apt cache" -- nothing points at the old repo.
- name: Remove repositories that were replaced
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/helm-stable-debian.list.old
    - /etc/apt/sources.list.d/cri-o.list
  tags: always

- name: Drop the stale baltocdn helm repository
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/helm-stable-debian.list
    regexp: 'baltocdn'
    state: absent
  failed_when: false
  tags: always

# containerd instead of cri-o: it is the runtime the distribution packages and
# the one Cilium and Piraeus are tested against. Mixing both on one node leaves
# two CRI sockets, and kubelet silently picks whichever it finds first.
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: yes
  tags: containerd

- name: Generate the containerd configuration
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml
  notify: Restart containerd
  tags: containerd

# kubelet runs with the systemd cgroup driver. With containerd left on cgroupfs the
# two disagree about who owns a container's cgroup, which shows up as pods that are
# evicted or restarted under memory pressure for no visible reason.
- name: Use the systemd cgroup driver
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*SystemdCgroup\s*=\s*)false$'
    replace: '\1true'
  notify: Restart containerd
  tags: containerd

# Debian ships bin_dir = /usr/lib/cni, while Cilium installs its plugin into
# /opt/cni/bin. Nothing complains until a *new* pod is scheduled -- running pods
# keep their networking, so the node looks Ready while every sandbox creation
# fails with 'failed to find plugin "cilium-cni"'.
- name: Point containerd at the CNI plugin directory Cilium installs into
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*bin_dir\s*=\s*)".*"$'
    replace: '\1"/opt/cni/bin"'
  notify: Restart containerd
  tags: containerd

- name: Add kubernetes repo key.
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
- name: Add kubernetes repositors.
  shell: |
    echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /' | tee /etc/apt/sources.list.d/kubernetes.list
  args:
    creates: /etc/apt/sources.list.d/kubernetes.list

- name: Install kubernetes tooling.
  ansible.builtin.apt:
    pkg:
    - kubeadm
    - kubelet
    - kubectl
    update_cache: yes

- name: Add helm repo key.
  shell: |
    curl -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey | gpg --dearmor | tee /usr/share/keyrings/helm.gpg > /dev/null
  args:
    creates: /usr/share/keyrings/helm.gpg
- name: Add helm repo.
  shell: |
    echo "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main" | tee /etc/apt/sources.list.d/helm-stable-debian.list
  args:
    creates: /etc/apt/sources.list.d/helm-stable-debian.list
- name: Install helm.
  ansible.builtin.apt:
    name: helm
    state: latest
    update_cache: yes
# k8scp used to point at the init node, tying the cluster endpoint to a single host:
# if it went down the API was gone for everyone, even though keepalived holds a VIP
# for exactly this case. Requires backbone.yml (keepalived) to have run first.
- name: Remove stale k8scp entries from /etc/hosts.
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^(?!{{ virtual_ip | regex_escape }}\s+{{ k8s_hostname }}\s*$).*\s{{ k8s_hostname }}\s*$'
    state: absent

- name: Point k8scp at the keepalived VIP.
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: '{{ virtual_ip }} {{ k8s_hostname }}'
    search_string: '{{ k8s_hostname }}'
# lvm2 is a hard dependency, not a convenience: the LINSTOR satellite creates the
# volume group and thin pool for pool2 on the host, and on a node without lvm2 that
# pool simply never appears. ipmitool and smartmontools are the two tools this
# cluster could not be debugged without -- ipmitool reconfigures the BMC in-band
# over KCS when the network is gone and no BMC credentials are at hand, which is
# exactly the situation a broken netplan produces.
- name: Install the storage and out-of-band tooling
  ansible.builtin.apt:
    name:
      - lvm2
      - ipmitool
      - smartmontools
    state: present

# journald defaults to 10% of the filesystem, which is ~45G here -- on the same
# DRAM-less QLC NVMe that carries the LINSTOR pool. 3.9G had already accumulated,
# and a node emitting PCIe errors fills it far faster than that. Logging must not
# compete with storage for the drive's endurance.
- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: '0755'

- name: Cap the systemd journal size
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    content: |
      [Journal]
      SystemMaxUse=500M
    mode: '0644'
  notify: Restart journald

# The onboard I210 NICs are defective on part of the MJ11-EC1 batch: netsvc-1
# emitted ~321 correctable PCIe Data-Link-Layer errors per second from their root
# ports (4.3M since boot, 3.7G of journal) while both interfaces were down and had
# never passed a single packet -- rx=0 tx=0. netsvc-2 has the same configuration
# and stays silent, so it is per-board silicon, not configuration. Taking the two
# endpoints off the bus drops the rate to zero; both cluster networks run on the
# 10G card, so nothing depends on them. Writing to /sys does not survive a reboot,
# hence the udev rule, which applies on the next boot.
- name: Remove the defective onboard I210 NICs from the PCI bus
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/80-disable-onboard-i210.rules
    content: |
      ACTION=="add", SUBSYSTEM=="pci", ATTR{vendor}=="0x8086", ATTR{device}=="0x1533", ATTR{remove}="1"
    mode: '0644'
  when: disable_onboard_i210 | bool

# bootstrap.yml renders this too, but only against the bootstrap group with the
# installer's root password -- it never runs again once a node is live. The netplan
# config has to be maintainable afterwards as well: the MAC match below is what keeps
# the 10G card configured when the BIOS renumbers the PCI buses.
- name: Update the netplan configuration
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/netplan.yml.j2"
    dest: /etc/netplan/01-netcfg.yaml
    mode: '0600'
  notify: Generate netplan

# The Debian installer leaves "iface {{ nic }} inet dhcp" in /etc/network/interfaces
# and networking.service enabled. ifupdown then runs its own dhclient on the very NIC
# netplan configures statically, and the node quietly carries a second, dynamic
# address from the DHCP range -- 192.168.1.116 alongside the static .14 on netsvc-1.
# Nothing errors, nothing in /etc/netplan hints at it. Same failure the NetworkManager
# comment in bootstrap.yml describes, different culprit.
- name: Stop ifupdown from running a second dhclient
  ansible.builtin.systemd:
    name: networking
    state: stopped
    enabled: false
    masked: true
  failed_when: false
  register: ifupdown_masked

- name: Drop the leftover dhclient
  ansible.builtin.shell: |
    pkill -f "dhclient.*{{ nic }}" || true
    ip addr show {{ nic }} | grep -q "dynamic" && ip addr flush dev {{ nic }} label "{{ nic }}" scope global || true
  changed_when: false
  when: ifupdown_masked is changed
