---
# k8s docs recommend to disable swapping.
- name: Enable noswap service
  systemd:
    name: noswap
    state: started
    enabled: true
    daemon_reload: true

- name: Restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true
    daemon_reload: true

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

# async/poll 0: netplan apply can briefly drop the link it is reconfiguring, and a
# synchronous call would hang the SSH connection that triggered it.
- name: Generate netplan
  ansible.builtin.command: netplan generate
  async: 45
  poll: 0
  notify: Apply netplan
  tags: [netplan]

- name: Apply netplan
  ansible.builtin.command: netplan apply
  async: 45
  poll: 0
  tags: [netplan]

- name: Reload sshd units
  ansible.builtin.systemd:
    name: ssh
    state: restarted
    daemon_reload: true

# async/poll 0: restarting the kubelet on the node that runs the control plane can
# stall the connection Ansible is talking over, same reason as netplan above.
  tags: [harden]

- name: Restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    daemon_reload: true
  async: 60
  poll: 0
  tags: [harden]
