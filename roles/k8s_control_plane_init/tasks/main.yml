---
# The only guard on "kubeadm init" below is "creates: /etc/kubernetes/admin.conf", which
# says nothing about whether a cluster already exists -- it only asks whether THIS node
# was ever initialised. Point k8s_init_node at a rebuilt or replaced machine and the
# role happily builds a SECOND cluster, with fresh CAs, next to the live one. This
# check asks the running cluster instead: if the control-plane endpoint already answers,
# there is nothing to initialise and the whole role is skipped.
- name: Find out whether a cluster is already running behind the endpoint
  ansible.builtin.uri:
    url: "https://{{ k8s_hostname }}:6443/livez"
    validate_certs: false
    status_code: [200, 401, 403]
    timeout: 10
  register: existing_cluster
  failed_when: false
  changed_when: false
  check_mode: false

- name: Add Cluster config.
  ansible.builtin.template:
    src: kubeadm-config.j2
    dest: /tmp/kubeadm-config.yaml
# Guarded on the task, not the role: everything after this -- the Cilium release and
# especially the fetch block that puts the CA material into /tmp/k8s for
# k8s_control_plane_join -- has to keep running on every pass, including the normal
# case where the cluster is long since up.
- name: Init cluster.
  shell: |
    kubeadm init --config=/tmp/kubeadm-config.yaml --skip-phases=addon/kube-proxy | tee /tmp/kubeadm-init.out
  args:
    creates: /etc/kubernetes/admin.conf
  when: existing_cluster.status is not defined or existing_cluster.status not in [200, 401, 403]
- name: Create kubectl directory.
  ansible.builtin.file:
    path: /root/.kube/
    state: directory    
- name: Copy kube config.
  command: cp /etc/kubernetes/admin.conf /root/.kube/config
  args:
    creates: /root/.kube/config

- name: Add cilium helm repo.
  shell: |
    helm repo add cilium https://helm.cilium.io/
    helm repo update
- name: Add Cilium config.
  ansible.builtin.template:
    src: cilium-config.j2
    dest: /tmp/cilium-config.yaml
- name: Wait until kubernetes is available.
  ansible.builtin.wait_for:
    port: 6443
- name: Install cilium to k8s.
  shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    helm upgrade --install cilium cilium/cilium --version {{ cilium_version }} --namespace kube-system --reset-values -f /tmp/cilium-config.yaml
- name: Add lb ip-pool config.
  ansible.builtin.template:
    src: lbpool.j2
    dest: /tmp/lbpool.yaml
- name: Add LoadBalancer IP-pool.
  shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl apply -f /tmp/lbpool.yaml

# Download configuration to local system to use it later for joining the cluster.
# This way the config can stored at any service/place without impact on this code.
- name: Create temporary directory.
  become: false
  ansible.builtin.file:
    path: /tmp/k8s
    state: directory
  delegate_to: 127.0.0.1
- name: Create temporary etcd directory.
  become: false
  ansible.builtin.file:
    path: /tmp/k8s/etcd
    state: directory
  delegate_to: 127.0.0.1
- name: Wait until k8s config is available.
  ansible.builtin.wait_for:
    path: /etc/kubernetes/admin.conf
- name: Download kube config.
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: /tmp/k8s/
    flat: true
- name: Wait until k8s certificates are available.
  ansible.builtin.wait_for:
    path: /etc/kubernetes/pki/etcd/ca.key    
- name: Download kubernetes keys.
  ansible.builtin.fetch:
    src: /etc/kubernetes/pki/{{ item }}
    dest: /tmp/k8s/{{ item }}
    flat: true
  with_items:
    - ca.crt
    - ca.key
    - sa.key
    - sa.pub
    - front-proxy-ca.crt
    - front-proxy-ca.key
    - etcd/ca.crt
    - etcd/ca.key
- name: Allow scheduling
  shell: |
    export KUBECONFIG=~/.kube/config
    kubectl taint node $(hostname) node-role.kubernetes.io/control-plane:NoSchedule- 2> /dev/null || true