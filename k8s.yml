---
- name: Prepare kubernetes nodes
  hosts:
  - backbone
  - netsvc
  become: yes
  pre_tasks:
  # k8scp zeigt auf die keepalived-VIP. Laeuft keepalived noch nicht, gibt es keinen
  # Endpunkt -- das faellt sonst erst spaeter als schwer deutbarer Timeout im
  # kubeadm-Lauf auf. Port 22, weil der auf jedem Node offen ist.
  - name: Ensure the keepalived VIP is up (run backbone.yml first).
    ansible.builtin.wait_for:
      host: "{{ virtual_ip }}"
      port: 22
      timeout: 10
    delegate_to: localhost
    become: false
    run_once: true
  roles:
  - k8s_prepare_server

- name: Get kubernetes control-plane running
  hosts: backbone
  become: yes
  roles:
  - role: k8s_control_plane_init
    when: inventory_hostname == k8s_init_node
  - role: k8s_control_plane_join
    when: inventory_hostname != k8s_init_node

- name: Get kubernetes data-plane running
  hosts: netsvc
  become: yes  
  roles:  
  - k8s_data_plane_join
