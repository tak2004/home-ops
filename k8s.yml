---
- name: Prepare kubernetes nodes
  hosts:
  - backbone
  - netsvc
  become: yes
  pre_tasks:
  # k8scp resolves to the keepalived VIP. Without keepalived running there is no
  # endpoint at all, which would otherwise surface much later as a hard-to-read
  # timeout during kubeadm. Port 22, because that is open on every node.
  - name: Ensure the keepalived VIP is up (run backbone.yml first).
    ansible.builtin.wait_for:
      host: "{{ virtual_ip }}"
      port: 22
      timeout: 10
    delegate_to: localhost
    become: false
    run_once: true
  roles:
  - k8s_prepare_server

- name: Get kubernetes control-plane running
  hosts: backbone
  become: yes
  roles:
  - role: k8s_control_plane_init
    when: inventory_hostname == k8s_init_node
  # No "when" here: the role guards itself on creates: /etc/kubernetes/kubelet.conf, so a
  # member skips the join. Excluding k8s_init_node instead meant that node could never
  # rejoin after being reset -- it got the init role, whose kubeadm init is correctly
  # refused while the endpoint answers, and the join role never at all.
  - role: k8s_control_plane_join

- name: Get kubernetes data-plane running
  hosts: netsvc
  become: yes  
  roles:  
  - k8s_data_plane_join

- import_playbook: storage.yml
